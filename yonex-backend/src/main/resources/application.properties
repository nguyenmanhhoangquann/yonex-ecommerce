spring.application.name=yonex-backend
server.port=${PORT:8080}

# Active profile: 'dev' for embedded H2 (MySQL mode, zero-setup), 'mysql' for local MySQL service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA Settings
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:yonex-secret-key-for-jwt-signing-must-be-at-least-256-bits-long-2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Swagger OpenAPI Path
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
